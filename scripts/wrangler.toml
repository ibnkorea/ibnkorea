name = "ibn-analytics"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = "a74e40a947bebdb998ae5cef515e09fc"

# Worker URL: https://ibn-analytics.urbane9293.workers.dev
# Subdomain: urbane9293.workers.dev

# GitHub API 연동 (페이지 에디터용) - 추후 설정
[vars]
GITHUB_OWNER = ""
GITHUB_REPO = ""
GITHUB_BRANCH = "main"

# Cron Trigger - 매일 KST 03:00 (UTC 18:00) GA4 데이터 수집
[triggers]
crons = ["0 18 * * *"]

# KV 네임스페이스 바인딩 (Airtable 캐싱용)
[[kv_namespaces]]
binding = "CACHE"
id = "453c99bf8f4b445aad9878a7c9173364"

# R2 버킷 바인딩 (이미지 업로드용)
# S3 Endpoint: https://a74e40a947bebdb998ae5cef515e09fc.r2.cloudflarestorage.com
# Public URL: https://pub-5adc3ecd20c347cfb03e96cae9ceb623.r2.dev
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ibnkorea"
